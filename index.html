<!DOCTYPE html>
<!-- 告诉浏览器使用 HTML5 标准 -->
<html lang="zh-CN">
<!-- lang="zh-CN" 表示网页使用中文 -->

<head>
    <!-- head 部分包含网页的配置信息，不会直接显示在页面上 -->
    <meta charset="UTF-8">
    <!-- 设置文字编码为 UTF-8，这样可以正确显示中文 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 让网页在手机和电脑上都能正常显示 -->
    <title>Minecraft 社区 - 首页</title>
    <!-- 这是网页的标题，会显示在浏览器的标签页上 -->
        <link rel="stylesheet" href="css/style.css">
    <!-- 链接到样式文件，让网页变得更漂亮 -->
</head>

<body>
    <!-- ========== 1. 表头区域 ========== -->
    <header class="main-header">
        <div class="header-content">
            <!-- 网站 Logo 和标题 -->
            <div class="logo-section">
                <div class="logo-icon">
                    <span class="logo-emoji">⛏️</span>
                </div>
                <div class="title-section">
                    <h1 class="main-title">Minecraft 社区</h1>
                    <p class="subtitle">分享 · 创造 · 探索</p>
                </div>
            </div>
            
            <!-- 主导航栏 -->
            <nav class="main-nav">
                <a href="index.html" class="nav-link active">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">首页</span>
                </a>
                <a href="versions.html" class="nav-link">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">版本库</span>
                </a>
                <a href="qa.html" class="nav-link">
                    <span class="nav-icon">❓</span>
                    <span class="nav-text">问答</span>
                </a>
                <a href="submit.html" class="nav-link">
                    <span class="nav-icon">✏️</span>
                    <span class="nav-text">发布帖子</span>
                </a>
            </nav>
        </div>
    </header>
    
    <!-- ========== 2. 标签导航系统 ========== -->
    <section class="tabs-section">
        <div class="tabs-container">
            <!-- 分类标签 -->
            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">
                    <span class="tab-icon">🎯</span>
                    <span class="tab-text">全部</span>
                </button>
                <button class="tab-btn" data-category="server">
                    <span class="tab-icon">🖥️</span>
                    <span class="tab-text">服务器</span>
                </button>
                <button class="tab-btn" data-category="redstone">
                    <span class="tab-icon">⚡</span>
                    <span class="tab-text">红石</span>
                </button>
                <button class="tab-btn" data-category="building">
                    <span class="tab-icon">🏗️</span>
                    <span class="tab-text">建筑</span>
                </button>
                <button class="tab-btn" data-category="survival">
                    <span class="tab-icon">🌲</span>
                    <span class="tab-text">生存</span>
                </button>
                <button class="tab-btn" data-category="qa">
                    <span class="tab-icon">💬</span>
                    <span class="tab-text">问答</span>
                </button>
                <button class="tab-btn" data-category="versionNews">
                    <span class="tab-icon">📰</span>
                    <span class="tab-text">版本资讯</span>
                </button>
            </div>
            
            <!-- 搜索和筛选 -->
            <div class="search-filter">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" class="search-input" placeholder="搜索帖子...">
                </div>
            </div>
        </div>
    </section>
    
    <!-- ========== 3. 帖子内容展示区域 ========== -->
    <main class="content-main">
        <!-- 统计信息 -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-icon">📊</span>
                <span class="stat-label">总帖子数：</span>
                <span class="stat-value" id="total-posts">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">📁</span>
                <span class="stat-label">分类数：</span>
                <span class="stat-value">7</span>
            </div>
        </div>
        
        <!-- 内容网格 -->
        <div class="posts-grid" id="posts-container">
            <!-- 所有帖子将在这里动态渲染 -->
            <!-- JavaScript 会找到这个容器并往里面添加帖子卡片 -->
        </div>
        
        <!-- 空状态提示 -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <div class="empty-icon">📭</div>
            <h3>暂无帖子</h3>
            <p>快来发布第一篇帖子吧！</p>
            <a href="submit.html" class="create-post-btn">
                <span>➕</span> 发布帖子
            </a>
        </div>
        
        <!-- 加载更多 -->
        <div class="load-more-container" id="load-more-container" style="display: none;">
            <button class="load-more-btn" id="load-more-btn">
                <span>📥</span> 加载更多
            </button>
        </div>
    </main>
    
    <!-- ========== 4. 页脚区域 ========== -->
    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>Minecraft 社区</h4>
                <p>一个属于所有 Minecraft 爱好者的家园</p>
            </div>
            <div class="footer-section">
                <h4>快速链接</h4>
                <div class="footer-links">
                    <a href="index.html">首页</a>
                    <a href="versions.html">版本库</a>
                    <a href="qa.html">问答</a>
                    <a href="submit.html">发布帖子</a>
                </div>
            </div>
            <div class="footer-section">
                <h4>联系我们</h4>
                <p>QQ 群：123456789</p>
                <p>邮箱：contact@mc-community.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Minecraft 社区 V1. All rights reserved.</p>
        </div>
    </footer>
    
    <!-- JavaScript 文件 -->
    <script src="js/main.js"></script>
</body>
</html>
